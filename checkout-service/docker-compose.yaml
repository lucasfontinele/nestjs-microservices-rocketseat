version: "3.8"

services:
  checkout-db:
    image: postgres:15
    container_name: checkout-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkout_db
    ports:
      - "5432:5432"
    volumes:
      - checkout-db-data:/var/lib/postgresql/data
    networks:
      - checkout-network

volumes:
  checkout-db-data:

networks:
  checkout-network:
    driver: bridge
